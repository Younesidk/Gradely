# Run with: docker compose up -d --build
# Settings come from .env (copy .env.example). Values set under `environment` below override it.
services:
  gradely:
    build: .
    image: gradely:latest
    container_name: gradely
    restart: unless-stopped
    ports:
      - "${GRADELY_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      GRADELY_ADDR: ":8080"
      GRADELY_DATA_DIR: /data
      # Secure cookies need HTTPS. Set GRADELY_SECURE_COOKIES=false in .env to try it over plain http://localhost.
      GRADELY_SECURE_COOKIES: ${GRADELY_SECURE_COOKIES:-true}
    volumes:
      - gradely-data:/data

volumes:
  gradely-data:
